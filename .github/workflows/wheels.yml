name: Build wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple silicon (arm64); macos-15-intel is the Intel
        # (x86_64) image that replaced the retired macos-13.
        os: [ubuntu-22.04, macos-14, macos-15-intel]

    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen (macOS)
        # Homebrew ships Eigen 5.x; cmake/FindEigen3.cmake accepts 3.4.x and 5.x.
        if: runner.os == 'macOS'
        run: brew install eigen

      - name: Build wheels
        # cibuildwheel 3.x: CIBW_TEST_SOURCES (added in 3.0; 2.21.3 ignores
        # it, so the test command found no files) and manylinux_2_28 as the
        # default Linux image. 3.4.1 is the last 3.x release (2026-04-02).
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # Build for Python 3.9-3.13
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # Skip musllinux (Alpine) and 32-bit builds
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32"
          # Published wheels are built WITHOUT SuiteSparse UMFPACK, which is
          # GPL-2.0-or-later; EdgeFEM is MIT. A wheel that links UMFPACK
          # (EDGEFEM_USE_SUITESPARSE=ON) would carry the GPL's conditions,
          # and its libumfpack dependency would not resolve on a user's
          # machine. SKBUILD_CMAKE_DEFINE overrides pyproject.toml, so the
          # wheels stay on Eigen SparseLU even if that default changes.
          CIBW_ENVIRONMENT: >
            SKBUILD_CMAKE_DEFINE="EDGEFEM_USE_SUITESPARSE=OFF"
          CIBW_ENVIRONMENT_MACOS: >
            SKBUILD_CMAKE_DEFINE="EDGEFEM_USE_SUITESPARSE=OFF"
            MACOSX_DEPLOYMENT_TARGET=14.0
          # CMakeLists.txt needs Eigen >= 3.4; the manylinux_2_28 image
          # (AlmaLinux 8) offers 3.3. Install the 3.4.0 headers and CMake
          # config (cmake from pip, since the image may not have it).
          CIBW_BEFORE_ALL_LINUX: >
            curl -sSL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
            | tar xz -C /tmp &&
            /opt/python/cp312-cp312/bin/pip install cmake &&
            /opt/python/cp312-cp312/bin/cmake -S /tmp/eigen-3.4.0 -B /tmp/eigen-build
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_TESTING=OFF &&
            /opt/python/cp312-cp312/bin/cmake --install /tmp/eigen-build
          # Fast smoke test of the installed wheel (about 1 s): version and
          # build flags, one WR-90 waveguide solve from a committed mesh, and
          # the contract-fixture tests. cibuildwheel copies the listed
          # sources into a temporary directory and runs the command there,
          # so the repository's python/ cannot shadow the wheel.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: >
            tools/wheel_smoke.py
            examples/rect_waveguide.msh
            python/tests/test_contract.py
          CIBW_TEST_COMMAND: >
            python tools/wheel_smoke.py --expect-umfpack off &&
            python -m pytest -q python/tests/test_contract.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/edgefem/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
