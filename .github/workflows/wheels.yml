name: Build wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Build and test (not publish) when the packaging changes.
  pull_request:
    paths:
      - pyproject.toml
      - CMakeLists.txt
      - cmake/**
      - python/CMakeLists.txt
      - python/pyedgefem.cpp
      - tools/wheel_smoke.py
      - .github/workflows/wheels.yml

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple silicon (arm64); macos-15-intel is the Intel
        # (x86_64) image. GitHub rejects macos-14 and macos-13. Wheels
        # still target macOS 14 (MACOSX_DEPLOYMENT_TARGET below).
        os: [ubuntu-22.04, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen (macOS)
        # Homebrew ships Eigen 5.x; cmake/FindEigen3.cmake accepts 3.4.x and 5.x.
        if: runner.os == 'macOS'
        run: brew install eigen

      - name: Build wheels
        # cibuildwheel 3.x: CIBW_TEST_SOURCES (added in 3.0; 2.21.3 ignores
        # it, so the test command found no files) and manylinux_2_28 as the
        # default Linux image. 3.4.1 is the last 3.x release (2026-04-02).
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # Build for Python 3.9-3.13
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # Skip musllinux (Alpine) and 32-bit builds
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32"
          # Published wheels are built WITHOUT SuiteSparse UMFPACK, which is
          # GPL-2.0-or-later; EdgeFEM is MIT. A wheel that links UMFPACK
          # (EDGEFEM_USE_SUITESPARSE=ON) would carry the GPL's conditions,
          # and its libumfpack dependency would not resolve on a user's
          # machine. SKBUILD_CMAKE_DEFINE overrides pyproject.toml, so the
          # wheels stay on Eigen SparseLU even if that default changes.
          CIBW_ENVIRONMENT: >
            SKBUILD_CMAKE_DEFINE="EDGEFEM_USE_SUITESPARSE=OFF"
          CIBW_ENVIRONMENT_MACOS: >
            SKBUILD_CMAKE_DEFINE="EDGEFEM_USE_SUITESPARSE=OFF"
            MACOSX_DEPLOYMENT_TARGET=14.0
          # CMakeLists.txt needs Eigen >= 3.4; the manylinux_2_28 image
          # (AlmaLinux 8) offers 3.3. Install the 3.4.0 headers and CMake
          # config (cmake from pip, since the image may not have it). The
          # tag is cloned and its commit checked (GitLab's generated
          # archives are not byte-stable, so a tarball hash could break).
          CIBW_BEFORE_ALL_LINUX: >
            (command -v git || dnf -y install git) &&
            git clone --quiet --depth 1 --branch 3.4.0
            https://gitlab.com/libeigen/eigen.git /tmp/eigen-3.4.0 &&
            test "$(git -C /tmp/eigen-3.4.0 rev-parse HEAD)"
            = 3147391d946bb4b6c68edd901f2add6ac1f31f8c &&
            /opt/python/cp312-cp312/bin/pip install cmake &&
            /opt/python/cp312-cp312/bin/cmake -S /tmp/eigen-3.4.0 -B /tmp/eigen-build
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_TESTING=OFF &&
            /opt/python/cp312-cp312/bin/cmake --install /tmp/eigen-build
          # Fast smoke test of the installed wheel (about 1 s): version and
          # build flags, one WR-90 waveguide solve from a committed mesh, and
          # the contract-fixture tests. cibuildwheel copies the listed
          # sources into a temporary directory and runs the command there,
          # so the repository's python/ cannot shadow the wheel.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_SOURCES: >
            tools/wheel_smoke.py
            examples/rect_waveguide.msh
            python/tests/test_contract.py
          CIBW_TEST_COMMAND: >
            python tools/wheel_smoke.py --expect-umfpack off &&
            python -m pytest -q python/tests/test_contract.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      # README names the sdist as the install path off the wheel
      # platforms: build it into a wheel and run the smoke test.
      - name: Install and test the sdist
        run: |
          sudo apt-get update && sudo apt-get install -y libeigen3-dev ninja-build
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/sdist-venv/bin/python \
            "$GITHUB_WORKSPACE/tools/wheel_smoke.py" \
            --mesh "$GITHUB_WORKSPACE/examples/rect_waveguide.msh" \
            --expect-umfpack off

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/edgefem/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
