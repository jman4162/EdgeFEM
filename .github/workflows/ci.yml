name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-format-19 clang-tidy-19 libeigen3-dev libsuitesparse-dev gmsh
          sudo ln -sf /usr/bin/clang-format-19 /usr/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-19 /usr/bin/clang-tidy
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt
          python -m pip install pybind11 matplotlib pytest numpy
      - name: Get pybind11 CMake dir
        id: pybind11_dir
        run: echo "dir=$(python3 -c 'import pybind11; print(pybind11.get_cmake_dir())')" >> $GITHUB_ENV
      - name: Configure
        # CI builds with SuiteSparse UMFPACK (EDGEFEM_USE_SUITESPARSE=ON).
        # UMFPACK is GPL-2.0-or-later, but CI only runs the code and
        # distributes nothing, so that does not apply here; wheels.yml
        # builds without it. With Eigen SparseLU the fast Python suite took
        # 22 min and peaked at 10.8 GB; with UMFPACK it takes 2 min.
        # test_direct_solvers_backends still checks SparseLU against
        # UMFPACK to 1e-9.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEDGEFEM_PYTHON=ON -DEDGEFEM_USE_SUITESPARSE=ON -DEDGEFEM_WARNINGS_AS_ERRORS=ON -Dpybind11_DIR=${{ env.dir }}
      - name: Build
        run: cmake --build build -j
      - name: Static analysis
        run: bash tools/lint.sh build
      - name: Unit tests
        # Every registered test. Those labelled known_issue carry
        # WILL_FAIL TRUE: they pass while their defect is open and fail
        # once it is fixed (see tests/CMakeLists.txt).
        run: ctest --test-dir build -j --output-on-failure
      - name: Python integration tests
        # The slow known-answer patch test (`-m slow`) is deselected by
        # addopts in pyproject.toml and does not run here.
        env:
          PYTHONPATH: build/python:python
        run: pytest python/tests/ -v --tb=short
      - name: Mesh QA (agents)
        run: python tools/agents/mesh_qa.py --in examples --out artifacts/mesh_qa
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgefem-artifacts
          path: artifacts

  # The configuration every wheel user gets: Eigen SparseLU, no UMFPACK.
  sparselu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libeigen3-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEDGEFEM_USE_SUITESPARSE=OFF -DEDGEFEM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        # The long accuracy benchmarks run in build-test (UMFPACK).
        run: ctest --test-dir build -j --output-on-failure -LE benchmark -E test_sparam_accuracy

  # Debug build (Eigen bounds asserts on) with AddressSanitizer and
  # UndefinedBehaviorSanitizer, smoke subset.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libeigen3-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DEDGEFEM_USE_SUITESPARSE=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Smoke tests under sanitizers
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build -L smoke -j --output-on-failure --timeout 900

  # macOS (the main development platform; Homebrew Eigen 5.x).
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install eigen ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEDGEFEM_USE_SUITESPARSE=OFF -DEDGEFEM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build -j --output-on-failure -LE benchmark -E test_sparam_accuracy
