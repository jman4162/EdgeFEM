[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "edgefem"
dynamic = ["version"]
description = "3D FEM Electromagnetics Simulator for RF and mmWave"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "John Hodge"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
keywords = ["electromagnetics", "fem", "simulation", "rf", "mmwave", "antenna", "s-parameters"]
# gmsh is required at runtime by every Design.generate_mesh(); the pip
# package ships both the Python API and the gmsh executable.
dependencies = ["numpy>=1.20", "gmsh>=4.11"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest", "pytest-cov"]
all = ["matplotlib>=3.5", "pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/jman4162/EdgeFEM"
Documentation = "https://github.com/jman4162/EdgeFEM#readme"
Repository = "https://github.com/jman4162/EdgeFEM"
Issues = "https://github.com/jman4162/EdgeFEM/issues"

[tool.pytest.ini_options]
markers = [
    "slow: known-answer full-wave runs that take minutes and several GB of memory; deselected by default, run with `pytest -m slow`",
]
addopts = "-m 'not slow'"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
EDGEFEM_PYTHON = "ON"
EDGEFEM_BUILD_VECTOR = "ON"
EDGEFEM_BUILD_SCALAR = "ON"
# UMFPACK is GPL-2.0-or-later and EdgeFEM is MIT, so wheels that are
# distributed are built without it. A private build can turn it on with
# `uv build --wheel -C cmake.define.EDGEFEM_USE_SUITESPARSE=ON`.
EDGEFEM_USE_SUITESPARSE = "OFF"

[tool.scikit-build.wheel]
# Install the compiled pyedgefem module at the root level
install-dir = "."
# Include the edgefem Python package
packages = ["python/edgefem"]

# One source of truth for the version: __version__ in the package.
# CMakeLists.txt reads the same line.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/edgefem/__init__.py"
